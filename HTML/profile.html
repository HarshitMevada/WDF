<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="style.css?v=20261022-1827">
</head>
<body class="body profile-page">
    <div>
        <nav class="nav">
            <a href="home.html">CHARUSAT</a>
            <a href="fees_payment.html">Fees</a>
            <a href="dashboard.php">Dashboard</a>
            <a href="profile.html">Profile</a>
        </nav>
    </div>

    <main class="page-shell">
        <header class="page-heading">
            <p class="eyebrow">ACCOUNT</p>
            <h1>Student Profile</h1>
            <p>Keep your personal and academic details up to date.</p>
        </header>
        <form class="page-form profile-form">
            <fieldset class="form-section">
                <legend>Personal details</legend>
                <div class="profile-fields">
                    <label for="firstName">First name<input id="firstName" type="text" autocomplete="given-name"></label>
                    <label for="middleName">Middle name<input id="middleName" type="text" autocomplete="additional-name"></label>
                    <label for="lastName">Last name<input id="lastName" type="text" autocomplete="family-name"></label>
                    <label for="fatherName">Father's name<input id="fatherName" type="text"></label>
                    <label for="motherName">Mother's name<input id="motherName" type="text"></label>
                    <label for="hobby">Hobby<input id="hobby" type="text"></label>
                </div>
            </fieldset>
            <fieldset class="form-section">
                <legend>Contact information</legend>
                <div class="profile-fields">
                    <label for="contactNumber">Contact number<input id="contactNumber" type="tel" autocomplete="tel"></label>
                    <label for="emailAddress">Email<input id="emailAddress" type="email" autocomplete="email"></label>
                    <label for="permanentAddress">Permanent address<textarea id="permanentAddress" rows="3" autocomplete="street-address"></textarea></label>
                    <label for="temporaryAddress">Temporary address<textarea id="temporaryAddress" rows="3"></textarea></label>
                </div>
            </fieldset>
            <fieldset class="form-section">
                <legend>Academic details</legend>
                <div class="profile-fields profile-fields-single">
                    <label for="program">Program<input id="program" type="text"></label>
                </div>
            </fieldset>
            <div class="form-submit-row">
                <p>Keep your contact details current so important updates reach you.</p>
                <button type="button">Save profile</button>
            </div>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
