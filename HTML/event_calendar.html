<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Calendar</title>
    <link rel="stylesheet" href="style.css?v=20261022-1827">
</head>

<body class="body event-page">
    <div>
        <nav class="nav">
            <a href="home.html">CHARUSAT</a>
            <a href="fees_payment.html">Fees</a>
            <a href="dashboard.php">Dashboard</a>
            <a href="profile.html">Profile</a>
        </nav>
    </div>
    <main class="events">
        <header class="events-heading">
            <p class="eyebrow">LIFE ON CAMPUS</p>
            <h1>Event calendar</h1>
            <p>Discover activities, workshops, and moments happening around campus.</p>
        </header>
        <section class="event-filter-panel" aria-label="Search and filter events">
            <div class="event-tools">
            <input type="search" id="eventSearch" placeholder="Search events..." aria-label="Search events">

            <select id="eventFilter" aria-label="Filter events by category">
                <option value="All">All Categories</option>
                <option value="Technical">Technical</option>
                <option value="Sports">Sports</option>
                <option value="Cultural">Cultural</option>
                <option value="Other">Other</option>
            </select>

            <select id="eventStatusFilter" aria-label="Filter events by registration status">
                <option value="All">All statuses</option>
                <option value="open">Open</option>
                <option value="closed">Closed</option>
            </select>

            <select id="eventSort" aria-label="Sort events">
                <option value="asc">Date: Oldest First</option>
                <option value="desc">Date: Newest First</option>
                <option value="az">Name: A to Z</option>
            </select>
            </div>
            <p class="filter-hint">Search by name or narrow the list by category, status, or date.</p>
        </section>
        <p id="eventMessage" role="status" aria-live="polite">Loading events...</p>
        <div class="event-container" id="eventList"></div>
        
        <div class="event-pagination">
            <button id="previousPage">Previous</button>
            <span id="pageNumber">Page 1</span>
            <button id="nextPage">Next</button>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
